# Intended primary role: project_coordinator (§10)
scenario_id: crm_migration_500
title: CRM Migration for 500 Employees in Six Weeks
summary: >
  Northshore Mutual is moving 500 employees onto ClientSphere in six weeks.
  Leadership wants a plan that covers schedule, owners, dependencies, testing,
  training, communications, risks, and go-live — and a status they can take
  to the board.

company:
  name: Northshore Mutual
  cash: 33800000
  employees: 500
  customers: 96
  markets:
    US:
      revenue: 44000000
  products:
    legacy_crm:
      customers: 96
      uptime: 0.991
    clientsphere:
      customers: 0
      uptime: 0.0
  projects:
    - ClientSphere cutover
    - PeopleCore identity sync
  risks:
    - quarter-end change freeze
    - vendor change windows
    - UAT data loss
  competitors:
    - Meridian Commerce
    - NovaWorks

events:
  - id: board_commits_six_weeks
    trigger: scenario_start
    requester: COO
    priority: high
    deadline: 2 simulated days
    summary: >
      The board committed to migrating all 500 employees to ClientSphere in
      six weeks, single go-live. Stand up the plan: owners, dependencies,
      testing, training, comms, risks. Flag anything that makes the date
      dishonest. First status report due end of this week.
  - id: vendor_calendar_arrives
    trigger: t_plus_1d
    requester: IT PMO
    priority: high
    deadline: 1 simulated day
    summary: >
      PeopleCore's vendor calendar and the CRM sandbox-refresh notice just
      landed in the SharePoint folder. Please fold them into the plan before
      we lock training dates.

# Requestable evidence. Workers pull these by name via the information broker and must
# synthesize the answer themselves — no single document states the conclusion.
documents:
  board_brief: >
    Decision: all 500 employees on ClientSphere in six weeks. One go-live.
    No wave language. Success = every employee can log in on Monday of week 7.
    Sponsor: COO. Named workstreams in the brief: data, identity, training,
    comms. Identity is listed as "IT, parallel track" with no vendor named.
  headcount_by_department: >
    Sales 180, Customer Support 130, Legal 42, Field Ops 148. Total 500.
    Sales and CS are not on a change freeze. Legal and Field Ops close the
    books through Friday of week 6; their change-freeze calendar is separate.
  peoplecore_vendor_calendar: >
    PeopleCore (HRIS) identity sync is vendor-owned (Alder Systems). Next
    production change window: Wednesday of week 5, 22:00–02:00 ET. No earlier
    window this quarter. SSO into ClientSphere requires the sync to have run
    at least once (login = PeopleCore UUID). Alder lead time for a net-new
    job is 10 business days; the job is already queued for that week-5 window.
  change_freeze_calendar: >
    Legal (42) and Field Ops (148): quarter-end freeze from Monday of week 5
    through Friday of week 6. Freeze lifts Monday of week 7. During freeze:
    no new production logins, no training that writes to production, no
    cutover. Sales and CS are exempt. The freeze was approved at last QBR
    and is not waived for "board dates."
  training_schedule_draft: >
    Enablement booked all 500 employees into a shared ClientSphere demo
    tenant in week 4 (four half-day sessions). Demo tenant is not connected
    to PeopleCore and does not receive production config promotions. No
    makeup sessions after week 4. Calendar holds already sent.
  crm_sandbox_refresh: >
    ClientSphere vendor notice: sandbox refresh Wednesday of week 3, 00:00 UTC.
    Refresh overwrites UAT with a production copy from T-1 and drops any
    UAT-only configuration and test data unless a snapshot/export is taken
    beforehand. Snapshot request lead time: 3 business days. No snapshot
    is currently requested.

# Engine-only. The scenario engine reveals this only through the work; personas
# never see it directly. It is the ground truth the Evaluator grades against.
hidden_truth: >
  "500 employees in six weeks, one go-live" is the executive wish, not a
  feasible plan. PeopleCore identity sync cannot run until the vendor window
  in week 5, and SSO cannot go live before that. Legal (42) and Field Ops
  (148) are frozen until Monday of week 7 — 190 people miss a week-6 cutover
  even if identity lands. Training is booked in week 4 against a demo tenant
  that will not match production, and a week-3 sandbox refresh will wipe UAT
  unless a snapshot is requested now. A honest plan: Wave 1 (Sales + CS, ~310)
  after identity sync; Wave 2 (Legal + Field Ops) when the freeze lifts;
  training moved to after identities exist; UAT snapshot before week 3.
  Status reports that still show a single week-6 go-live for all 500 should
  fail.
