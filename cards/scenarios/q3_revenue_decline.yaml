# Engine-only. The scenario engine reveals this only through the work; personas
# never see it directly. It is the ground truth the Evaluator grades against.
hidden_truth: >
  The decline is driven by a shift in product mix: a high-margin add-on was
  silently deprecated in a July release, so new customers land on the base plan
  only. Volume rose but average revenue per customer fell ~17%. Discounting and
  churn are red herrings — both are within normal range.
